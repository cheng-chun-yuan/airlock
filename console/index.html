<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Airlock Console</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* Visual language referenced from atptoken.ai: ink on canvas, hairline borders,
     haze panels, one ember accent, mono uppercase eyebrows, pill controls. */
  :root {
    --canvas:#ffffff; --haze:#f5f5f5; --hairline:#e6e6e6; --hairline-faint:#efefef;
    --ink:#141414; --umber:#6f6f6f; --sand:#a3a3a3;
    --ember:#f04d3b; --ember-tint:#fdedec; --ember-line:#f5c5bf;
    --ok:#1f7a4d; --ok-tint:#e8f4ee; --bad:#c2352a; --bad-tint:#fdedec; --warn:#9a6700; --warn-tint:#fdf4e1;
    --display:"Lexend", system-ui, sans-serif; --body:"Figtree", system-ui, sans-serif; --mono:"IBM Plex Mono", ui-monospace, monospace;
    --r-card:16px; --r-inner:10px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --canvas:#101010; --haze:#181818; --hairline:#2a2a2a; --hairline-faint:#222; --ink:#ededed; --umber:#a0a0a0; --sand:#6a6a6a;
    --ember:#ff6a55; --ember-tint:#2a1512; --ember-line:#5a2a24; --ok:#5cc78e; --ok-tint:#12241a; --bad:#ff7a70; --bad-tint:#2a1512; --warn:#e0b44c; --warn-tint:#2a2210; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.55 var(--body); background:var(--canvas); color:var(--ink); -webkit-font-smoothing:antialiased; }
  a { color:var(--ember); }
  header { display:flex; gap:20px; align-items:center; padding:14px 24px; border-bottom:1px solid var(--hairline); background:color-mix(in srgb, var(--canvas) 95%, transparent); backdrop-filter:blur(8px); position:sticky; top:0; z-index:5; }
  header h1 { font:600 17px var(--display); margin:0; letter-spacing:-0.01em; display:flex; align-items:center; gap:8px; }
  header h1 .dot { width:10px; height:10px; border-radius:99px; background:var(--ember); display:inline-block; }
  nav { display:flex; gap:4px; background:var(--haze); border:1px solid var(--hairline); border-radius:99px; padding:3px; }
  nav button { background:none; border:0; padding:6px 14px; cursor:pointer; color:var(--umber); font:500 13px var(--body); border-radius:99px; }
  nav button.active { color:var(--canvas); background:var(--ink); }
  .pill { font:500 11px var(--mono); letter-spacing:0.06em; padding:4px 10px; border-radius:99px; border:1px solid var(--hairline); color:var(--umber); background:var(--canvas); white-space:nowrap; }
  .eyebrow { font:500 11px var(--mono); letter-spacing:0.1em; text-transform:uppercase; color:var(--umber); margin:0 0 8px; }
  main { padding:24px; max-width:1240px; margin:0 auto; }
  .grid { display:grid; grid-template-columns: 340px 1fr; gap:16px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } main { padding:16px; } header { flex-wrap:wrap; padding:12px 16px; } }
  .card { background:var(--canvas); border:1px solid var(--hairline); border-radius:var(--r-card); padding:18px; }
  .card.haze { background:var(--haze); }
  .item { padding:12px; border-radius:var(--r-inner); cursor:pointer; border:1px solid transparent; margin-bottom:4px; }
  .item:hover { background:var(--canvas); border-color:var(--hairline); }
  .item.sel { background:var(--canvas); border-color:var(--ink); }
  .badge { font:500 11px var(--mono); letter-spacing:0.08em; text-transform:uppercase; padding:2px 9px; border-radius:99px; display:inline-block; }
  .s-pending{color:var(--warn)} .badge.s-pending{background:var(--warn-tint)}
  .s-approved,.s-auto,.s-valid{color:var(--ok)} .badge.s-approved,.badge.s-auto,.badge.s-valid{background:var(--ok-tint)}
  .s-denied,.s-blocked,.s-expired,.s-role_invalid,.s-proof_invalid,.s-revoked,.s-unknown{color:var(--bad)}
  .badge.s-denied,.badge.s-blocked,.badge.s-expired,.badge.s-role_invalid,.badge.s-proof_invalid,.badge.s-revoked{background:var(--bad-tint)}
  h3 { font:500 18px var(--display); letter-spacing:-0.01em; }
  pre { white-space:pre-wrap; word-break:break-word; font:12.5px/1.6 var(--mono); background:var(--haze); border:1px solid var(--hairline-faint); padding:12px; border-radius:var(--r-inner); margin:0; max-height:360px; overflow:auto; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width: 800px) { .cols { grid-template-columns: 1fr; } }
  .muted { color:var(--umber); } .mono { font-family:var(--mono); font-size:12px; word-break:break-all; }
  button.act { padding:9px 18px; border-radius:99px; border:1px solid var(--hairline); background:var(--canvas); color:var(--ink); cursor:pointer; font:500 14px var(--body); }
  button.act:hover { border-color:var(--ink); }
  button.primary { background:var(--ink); border-color:var(--ink); color:var(--canvas); }
  button.ember { background:var(--ember); border-color:var(--ember); color:#fff; }
  button.danger { color:var(--bad); border-color:var(--ember-line); background:var(--ember-tint); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  td,th { text-align:left; padding:9px 10px; border-bottom:1px solid var(--hairline-faint); vertical-align:top; }
  th { font:500 11px var(--mono); letter-spacing:0.1em; text-transform:uppercase; color:var(--umber); }
  .kv td:first-child { font:500 11px var(--mono); letter-spacing:0.08em; text-transform:uppercase; color:var(--umber); width:220px; }
  .table-wrap { overflow-x:auto; }
  @media (max-width: 800px) {
    .kv tr { display:block; padding:8px 0; border-bottom:1px solid var(--hairline-faint); }
    .kv td { display:block; width:auto !important; padding:2px 0; border:0; }
  }
  #qr img { image-rendering:pixelated; background:#fff; padding:10px; border-radius:var(--r-inner); border:1px solid var(--hairline); }
  textarea, input, select { width:100%; font:14px var(--body); padding:10px 12px; border-radius:var(--r-inner); border:1px solid var(--hairline); background:var(--canvas); color:var(--ink); }
  textarea:focus, input:focus, select:focus { outline:none; border-color:var(--ink); }
  mark { background:var(--ember-tint); color:var(--ember); border:1px solid var(--ember-line); border-radius:4px; padding:0 3px; }
</style>
</head>
<body>
<header>
  <h1><span class="dot"></span>Airlock</h1>
  <nav>
    <button data-tab="queue" class="active">Queue</button>
    <button data-tab="audit">Audit</button>
    <button data-tab="chat">Test chat</button>
  </nav>
  <span style="flex:1"></span>
  <span class="pill" id="mode">…</span>
</header>
<main>
  <section id="tab-queue" class="grid">
    <div class="card haze"><p class="eyebrow">Requests</p><div id="list"></div></div>
    <div class="card" id="detail"><p class="eyebrow">Detail</p><span class="muted">Select a request.</span></div>
  </section>
  <section id="tab-audit" hidden>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div><p class="eyebrow" style="margin:0">Hash chain</p><span id="chain"></span></div>
        <div class="row"><span class="mono" id="root"></span><button class="act" id="anchor">Anchor root to ENS</button></div>
      </div>
      <div id="anchorOut" class="mono muted"></div>
      <div class="table-wrap"><table><thead><tr><th>#</th><th>time</th><th>decision</th><th>model</th><th>role</th><th>World ID</th><th>reason</th><th>hash</th></tr></thead><tbody id="auditRows"></tbody></table></div>
    </div>
  </section>
  <section id="tab-chat" hidden>
    <div class="card">
      <div class="row"><select id="chatModel" style="width:auto"></select><input id="chatSession" placeholder="session id (optional)" style="width:260px" /></div>
      <textarea id="chatIn" rows="8" style="margin-top:8px" placeholder="Paste a contract and ask for a review…"></textarea>
      <div class="row" style="margin-top:8px"><button class="act ember" id="chatSend">Send</button><button class="act" id="chatContract">Load demo contract prompt</button><span class="muted" id="chatStatus"></span></div>
      <pre id="chatOut" style="margin-top:12px"></pre>
    </div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
let cfg = {}, items = [], selected = null;

document.querySelectorAll("nav button").forEach((b) => b.onclick = () => {
  document.querySelectorAll("nav button").forEach((x) => x.classList.toggle("active", x === b));
  ["queue","audit","chat"].forEach((t) => $("#tab-" + t).hidden = t !== b.dataset.tab);
  if (b.dataset.tab === "audit") loadAudit();
});

async function j(url, opts) { const r = await fetch(url, opts); return r.json(); }

async function loadQueue() {
  items = await j("/approvals");
  $("#list").innerHTML = items.map((r) => `<div class="item ${r.id===selected?"sel":""}" data-id="${r.id}">
      <div class="row" style="justify-content:space-between"><span class="badge s-${r.status}">${r.status}</span><span class="muted">${new Date(r.createdAt).toLocaleTimeString()}</span></div>
      <div class="muted mono">${esc(r.agent)}</div><div class="muted">→ ${esc(r.targetModel)} · risk ${r.riskLevel}</div></div>`).join("") || `<span class="muted">No approval requests yet. Auto-sent and blocked requests appear in Audit.</span>`;
  document.querySelectorAll(".item").forEach((el) => el.onclick = () => show(el.dataset.id));
}

const hl = (s) => esc(s).replace(/&lt;([A-Z_]+_\d+)&gt;/g, "<mark>&lt;$1&gt;</mark>");

async function show(id) {
  selected = id; history.replaceState(null, "", "#" + id); loadQueue();
  const r = await j("/approvals/" + id);
  const ents = Object.entries(r.entities).map(([k,v]) => `${k}×${v}`).join(" · ") || "none";
  $("#detail").innerHTML = `
    <div class="row" style="justify-content:space-between"><h3 style="margin:0">Request <span class="badge s-${r.status}">${r.status}</span></h3><span class="muted">expires ${new Date(r.expiresAt).toLocaleTimeString()}</span></div>
    <p class="muted">${esc(r.reason ?? "")}</p>
    <div class="cols" style="margin:10px 0">
      <div><p class="eyebrow">Original · stays local</p><pre>${esc(r.originalPreview)}</pre></div>
      <div><p class="eyebrow">Redacted · sent to ${esc(r.targetModel)}</p><pre>${hl(r.redactedPreview)}</pre></div>
    </div>
    <table class="kv">
      <tr><td>Masked entities</td><td>${ents}</td></tr>
      <tr><td>Residual risk</td><td class="s-${r.riskLevel==="low"?"valid":"denied"}">${r.riskLevel}${r.findings.length ? " — " + esc(r.findings.join("; ")) : ""}</td></tr>
      <tr><td>ENS policy</td><td class="mono">${esc(r.agent)}</td></tr>
      <tr><td>Required role</td><td class="mono">${esc(r.requiredRole)}</td></tr>
      <tr><td>payloadHash (World ID signal)</td><td class="mono">${r.payloadHash}</td></tr>
      <tr><td>viewHash</td><td class="mono">${r.viewHash}</td></tr>
    </table>
    ${r.status === "pending" ? `<div style="margin-top:14px" id="approveBox"></div>` : ""}`;
  if (r.status === "pending") renderApprove(r);
}

function renderApprove(r) {
  const box = $("#approveBox");
  const deny = `<button class="act danger" id="deny">Deny</button>`;
  if (cfg.worldIdMode === "mock") {
    box.innerHTML = `<div class="muted" style="margin-bottom:6px">Mock World ID (set WORLD_APP_ID for the real flow)</div>
      <div class="row">${(cfg.mockApprovers||[]).map((a) => `<button class="act primary" data-n="${a.nullifier}" data-name="${a.name}">Verify as ${a.name}</button>`).join("")} ${deny}</div>
      <pre id="verifyOut" style="margin-top:8px" hidden></pre>`;
    box.querySelectorAll("button[data-n]").forEach((b) => b.onclick = () => submit(r.id, { mock: true, nullifier: b.dataset.n, approverName: b.dataset.name }));
  } else {
    box.innerHTML = `<div class="row"><input id="approverName" placeholder="your ENS name, e.g. alice.${esc(r.requiredRole)}" style="width:360px" />
      <button class="act ember" id="wid">Approve with World ID</button> ${deny}</div><div id="qr" style="margin-top:10px"></div><pre id="verifyOut" style="margin-top:8px" hidden></pre>`;
    $("#wid").onclick = () => worldId(r);
  }
  $("#deny").onclick = async () => { await j(`/approvals/${r.id}/deny`, { method: "POST", headers: { "content-type": "application/json" }, body: "{}" }); show(r.id); };
}

async function loadIDKit() {
  if (window.IDKit) return window.IDKit;
  await new Promise((ok, err) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/@worldcoin/idkit-core@4.3.0/dist/idkit.global.js"; s.onload = ok; s.onerror = err; document.head.append(s); });
  return window.IDKit;
}

async function worldId(r) {
  const out = $("#verifyOut"); out.hidden = false; out.textContent = "Preparing World ID request…";
  try {
    const IDKit = await loadIDKit();
    const ctx = await j(`/approvals/${r.id}/worldid`);
    const req = await IDKit.request({ app_id: ctx.app_id, action: ctx.action, rp_context: ctx.rp_context, allow_legacy_proofs: true, environment: ctx.environment })
      .preset(IDKit.orbLegacy({ signal: ctx.signal }));
    const qr = qrcode(0, "M"); qr.addData(req.connectorURI); qr.make();
    $("#qr").innerHTML = qr.createImgTag(5) + `<div class="muted">Scan with World App (staging: simulator.worldcoin.org). <a href="${esc(req.connectorURI)}" target="_blank">open link</a></div>`;
    out.textContent = "Waiting for World App…";
    const res = await req.pollUntilCompletion({ timeout: 120000 });
    if (!res.success) { out.textContent = "World ID error: " + res.error; return; }
    await submit(r.id, { ...res.result, approverName: $("#approverName").value.trim() });
  } catch (e) { out.textContent = "World ID failed: " + e.message; }
}

async function submit(id, body) {
  const out = $("#verifyOut"); out.hidden = false;
  out.textContent = JSON.stringify(await j(`/approvals/${id}/verify`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }), null, 2);
  setTimeout(() => show(id), 800);
}

async function loadAudit() {
  const a = await j("/audit");
  $("#chain").innerHTML = a.chain.ok ? `<span class="badge s-valid">✓ intact · ${a.records.length} records</span>` : `<span class="badge s-denied">✗ broken at #${a.chain.brokenAt}</span>`;
  $("#root").innerHTML = `root ${a.merkleRoot.slice(0, 18)}…` + (a.ensLink ? ` <a href="${a.ensLink}" target="_blank">ENS ↗</a>` : "");
  $("#auditRows").innerHTML = a.records.slice().reverse().map((r) => `<tr><td>${r.seq}</td><td>${new Date(r.timestamp).toLocaleTimeString()}</td>
    <td><span class="badge s-${r.decision}">${r.decision}</span></td><td class="mono">${esc(r.targetModel ?? "")}</td><td class="s-${r.roleCheck ?? ""}">${r.roleCheck ?? "—"}</td>
    <td>${r.worldIdVerified ? "✓" : "—"}</td><td class="muted">${esc(r.reason ?? "")}</td><td class="mono">${r.hash.slice(0, 12)}…</td></tr>`).join("");
}
$("#anchor").onclick = async () => { $("#anchorOut").textContent = "anchoring…"; $("#anchorOut").textContent = JSON.stringify(await j("/audit/anchor", { method: "POST" })); loadAudit(); };

$("#chatContract").onclick = () => { $("#chatIn").value = cfg.demoPrompt ?? ""; $("#chatModel").value = "airlock/" + cfg.defaultClaudeModel; };
$("#chatSend").onclick = async () => {
  $("#chatStatus").textContent = "waiting (approval may be pending in Queue)…"; $("#chatOut").textContent = "";
  const headers = { "content-type": "application/json" }; if ($("#chatSession").value) headers["x-airlock-session"] = $("#chatSession").value;
  const r = await j("/v1/chat/completions", { method: "POST", headers, body: JSON.stringify({ model: $("#chatModel").value, messages: [{ role: "user", content: $("#chatIn").value }] }) });
  $("#chatStatus").textContent = r.airlock ? `route=${r.airlock.route} decision=${r.airlock.decision} egressed=${r.airlock.egressed}` : "";
  $("#chatOut").textContent = r.choices?.[0]?.message?.content ?? JSON.stringify(r, null, 2);
};

(async () => {
  cfg = await j("/config");
  $("#mode").textContent = `World ID: ${cfg.worldIdMode} · ENS: ${cfg.ensMode}`;
  const models = (await j("/v1/models")).data.map((m) => m.id);
  $("#chatModel").innerHTML = models.map((m) => `<option>${m}</option>`).join("");
  loadQueue();
  if (location.hash.length > 1) show(location.hash.slice(1)); // deep link: /console#<requestId>
  const es = new EventSource("/events");
  ["approval.created", "approval.resolved", "request.routed"].forEach((t) => es.addEventListener(t, () => { loadQueue(); if (selected) show(selected); if (!$("#tab-audit").hidden) loadAudit(); }));
})();
</script>
</body>
</html>
