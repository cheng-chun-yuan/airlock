# Snippet for librechat.yaml → endpoints.custom
# Raise LibreChat's request timeout: approvals can hold the request open for APPROVAL_TIMEOUT_MS.
endpoints:
  custom:
    - name: "Airlock"
      apiKey: "unused"
      baseURL: "http://host.docker.internal:8787/v1"
      models:
        default: ["auto", "airlock/claude-sonnet-5", "local/Qwen/Qwen3.5-35B-A3B-FP8"]
        fetch: true
      titleConvo: true
      titleModel: "local/Qwen/Qwen3.5-35B-A3B-FP8"
      modelDisplayLabel: "Airlock"
      headers:
        x-airlock-agent: "contract-agent.agents.airlock.eth"
        # Who is asking: shown to the approver and written to the audit log (check your LibreChat version supports user placeholders).
        x-airlock-user: "{{LIBRECHAT_USER_EMAIL}}"
        # Check your LibreChat version supports body placeholders in headers; otherwise drop this line.
        x-airlock-session: "{{LIBRECHAT_BODY_CONVERSATIONID}}"
